name: Measure 82 APK
# Подпись: ключ v81 из Secrets AK_KS_B64/AK_PW (резервная копия у владельца), кэш akrix-ks-v1 — запасной путь.
# Сборка APK-артефакта — на каждый push в measure-lab (как раньше). ПУБЛИКАЦИЯ обновления на телефоны (version.json + .sig, web/<ver>/, APK
# в ветку measure-lab-apk) — только push тега measure-v<версия> или ручной запуск (workflow_dispatch); перед публикацией — scripts/publish_guard.py
# (та же версия с другим содержимым или версия ниже опубликованной → ошибка). Аудит 82.18 M2.
on:
  push:
    branches: [measure-lab]
    tags: ['measure-v*']
    paths-ignore: ['prototypes/**', 'docs/**', 'tests/**', '*.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - id: ks
        uses: actions/cache/restore@v4
        with: { path: .signing, key: measure-lab-ks-v1 }
      - name: Signing key v81 from Secrets (AK_KS_B64, AK_PW)
        id: sec
        env: { KS: "${{ secrets.AK_KS_B64 }}", PW: "${{ secrets.AK_PW }}" }
        run: |
          if [ -n "$KS" ] && [ -n "$PW" ]; then mkdir -p ~/ks && printf '%s' "$KS" | tr -d ' \r\n' | base64 -d > ~/ks/release.jks && printf '%s' "$PW" | tr -d '\r\n' > ~/ks/pw && echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "::warning::Secrets AK_KS_B64/AK_PW не заданы — ключ из кэша"; fi
      - id: prodks   # запасной путь — ключ v81 из кэша main (workflow measure-apk.yml)
        if: steps.sec.outputs.ok != '1'
        uses: actions/cache/restore@v4
        with: { path: ~/ks, key: akrix-ks-v1, fail-on-cache-miss: true }
      - name: experimental.html = rebuild from v81 by scripts/build-experimental.py (fail on mismatch)
        run: python3 scripts/build-experimental.py --check
      - name: Update manifest/bundle + Updater state-machine tests (AKX-2026-0014)
        run: |
          python3 tests/test_update_manifest.py
          python3 tests/test_updater_jvm.py
      - name: Build (scripts/build_apk.py — v81 SHA check, asset check, apksigner verify)
        run: |
          export MEASURE_GRADLE="$(command -v gradle)"
          echo "::add-mask::$(cat ~/ks/pw)"
          export AK_KS=$HOME/ks/release.jks AK_PW=$(cat ~/ks/pw)
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms"
          python3 scripts/build_apk.py
      - name: Signer must be the v81 certificate (4f15e141...)
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs artifacts/measure-82*.apk | grep -q 'SHA-256 digest: 4f15e1417c9c7107d4a118061782edac3835dfef55396f303d8c637c8e083361' || { echo '::error::Подпись не совпадает с v81'; exit 1; }
      - if: steps.ks.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: { path: .signing, key: measure-lab-ks-v1 }
      - uses: actions/upload-artifact@v4
        with:
          name: measure-lab-apk
          path: |
            artifacts/measure-*.apk
            artifacts/measure-*.apk.sha256
            artifacts/asset-manifest.json
            artifacts/update/version.json
            artifacts/update/version.json.sig
      - name: Publish guard — same version must have the same content (fail → bump web/lab-version.js)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/measure-v')
        run: |
          rm -f /tmp/cur-version.json
          if git fetch -q --depth 1 origin measure-lab-apk 2>/dev/null; then git show FETCH_HEAD:version.json > /tmp/cur-version.json 2>/dev/null || rm -f /tmp/cur-version.json; fi
          python3 scripts/publish_guard.py artifacts/update/version.json /tmp/cur-version.json "$GITHUB_REF"
      - name: Publish APK + web bundle + version.json (+ .sig) to branch measure-lab-apk
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/measure-v')
        # Автообновление (AKX-2026-0014): приложение читает https://raw.githubusercontent.com/Akrixsoft/measure/measure-lab-apk/version.json
        # и файлы web/<версия>/ (SHA-256 каждого — в манифесте), APK — по apk.url/apk.sha256.
        run: |
          mkdir -p /tmp/pub && cp artifacts/measure-82*.apk artifacts/measure-82*.apk.sha256 artifacts/asset-manifest.json /tmp/pub/
          cp -r artifacts/update/web /tmp/pub/ && cp artifacts/update/version.json artifacts/update/version.json.sig /tmp/pub/
          python3 scripts/web_bundle.py verify /tmp/pub --signed
          AK_KS=$HOME/ks/release.jks AK_PW="$(cat ~/ks/pw)" python3 scripts/sign_manifest.py verify /tmp/pub/version.json
          cd /tmp/pub && git init -q && git checkout -q -b measure-lab-apk
          git config user.name "akrix-build" && git config user.email "build@akrix.local"
          git add -A && git commit -qm "Measure 82 APK from ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" measure-lab-apk
