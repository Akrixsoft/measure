name: Measure Lab APK
on:
  push:
    branches: [measure-lab]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - id: ks
        uses: actions/cache/restore@v4
        with: { path: .signing, key: measure-lab-ks-v1 }
      - name: Build (scripts/build_apk.py — v81 SHA check, asset check, apksigner verify)
        run: |
          export MEASURE_GRADLE="$(command -v gradle)"
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms"
          python3 scripts/build_apk.py
      - if: steps.ks.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: { path: .signing, key: measure-lab-ks-v1 }
      - uses: actions/upload-artifact@v4
        with:
          name: measure-lab-apk
          path: |
            artifacts/measure-lab-*.apk
            artifacts/measure-lab-*.apk.sha256
            artifacts/asset-manifest.json
