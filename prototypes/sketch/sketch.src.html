<script>
'use strict';
/* ═══ [BLOCK SK-STATE] модель ═══
   photos: {id, src, x, y, w (мир), iw, ih, cor: [[ix,iy]×4 ЛВ ПВ ПН ЛН] | null,
            els: [{id, t:'dim'|'obj'|'pt'|'txt', sp:'img'|'mm', a,b (точки), v, k, tx}], L?, H? (ручные)} */
const SAMPLE = 'data:image/jpeg;base64,__SAMPLE__';
const KINDS = {kol: ['Колонна', '#6B7785'], rig: ['Ригель', '#8A5A2B'], nis: ['Ниша', '#8A4026'], kor: ['Короб', '#5B6B7A'], okn: ['Проём', '#2E9E4F']};
const PTK = {roz: ['Розетка', '#D4A300'], vyk: ['Выкл.', '#7B3FC4'], svet: ['Свет', '#E0442B'], vod: ['Вода', '#1F6FD1']};
const S = {photos: [], view: {ox: 20, oy: 110, s: 0.42}, tool: 'pan', flow: 'A', kind: 'kol', ptk: 'roz', sel: null, und: [], imgs: {}};
const $ = id => document.getElementById(id), cv = $('cv'), cx = cv.getContext('2d');
const uid = () => Math.random().toString(36).slice(2, 9);
const DPR = () => devicePixelRatio || 1;
function snap() { S.und.push(JSON.stringify(S.photos.map(p => ({...p, rect: undefined})))); if (S.und.length > 60) S.und.shift(); }
function save() { try { localStorage.setItem('sketch.proto', JSON.stringify({photos: S.photos.map(p => ({...p, rect: undefined, src: p.src.length > 400000 && p.src !== SAMPLE ? '' : p.src})), flow: S.flow})); } catch (e) { } }
function toast(t) { const e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', 2600); }

/* ═══ [BLOCK SK-GEOM] гомография фото → плоскость стены ═══ */
function solve(A, b) { const n = b.length; for (let i = 0; i < n; i++) { let m = i; for (let r = i + 1; r < n; r++) if (Math.abs(A[r][i]) > Math.abs(A[m][i])) m = r; [A[i], A[m]] = [A[m], A[i]]; [b[i], b[m]] = [b[m], b[i]]; for (let r = i + 1; r < n; r++) { const f = A[r][i] / A[i][i]; for (let c = i; c < n; c++) A[r][c] -= f * A[i][c]; b[r] -= f * b[i]; } } const x = Array(n).fill(0); for (let i = n - 1; i >= 0; i--) { let s = b[i]; for (let c = i + 1; c < n; c++) s -= A[i][c] * x[c]; x[i] = s / A[i][i]; } return x; }
function homog(src, dst) { const A = [], b = []; for (let i = 0; i < 4; i++) { const [x, y] = src[i], [u, v] = dst[i]; A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u); A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v); } const h = solve(A, b); return [...h, 1]; }
const hap = (H, [x, y]) => { const w = H[6] * x + H[7] * y + H[8]; return [(H[0] * x + H[1] * y + H[2]) / w, (H[3] * x + H[4] * y + H[5]) / w]; };
const UNIT = [[0, 0], [1, 0], [1, 1], [0, 1]];
function geo(p) { if (!p.cor) return null; if (!p._g || p._gk !== JSON.stringify(p.cor)) { p._g = {f: homog(p.cor, UNIT), r: homog(UNIT, p.cor)}; p._gk = JSON.stringify(p.cor); p._rect = null; } return p._g; }

/* ═══ [BLOCK SK-BUILD] построение стены из размеров ═══
   Все элементы → мм стены (x от левого края, y от пола). Длина/высота — из размеров,
   охватывающих стену; введённые размеры до объектов задают их положение и габариты. */
function build(p) {
  const g = geo(p); if (!g) return null;
  const toU = (q, sp, LH) => sp === 'img' ? hap(g.f, q) : [q[0] / LH[0], 1 - q[1] / LH[1]];
  // 1. L и H
  let L = +p.L || 0, H = +p.H || 0, sl = 0, wl = 0, sh = 0, wh = 0;
  const ests = [];
  for (const e of p.els) if (e.t === 'dim' && e.v > 0 && e.sp === 'img') {
    const a = hap(g.f, e.a), b = hap(g.f, e.b), du = Math.abs(b[0] - a[0]), dv = Math.abs(b[1] - a[1]);
    if (du > dv && du > 0.05) { const w = du ** 3; sl += e.v / du * w; wl += w; ests.push(['L', e.v / du, du]); }
    else if (dv > 0.05) { const w = dv ** 3; sh += e.v / dv * w; wh += w; ests.push(['H', e.v / dv, dv]); }
  }
  // размер от края до края стены задаёт длину/высоту точно, остальные — только оценка
  let Lx = 0, Hx = 0; const ed = u => u < 0.06 || u > 0.94;
  for (const e of p.els) if (e.t === 'dim' && e.v > 0 && e.sp === 'img') { const a = hap(g.f, e.a), b = hap(g.f, e.b);
    if (Math.abs(b[0] - a[0]) > 0.88 && ed(a[0]) && ed(b[0])) Lx = e.v; if (Math.abs(b[1] - a[1]) > 0.88 && ed(a[1]) && ed(b[1])) Hx = e.v; }
  if (!L) L = Lx || (wl ? sl / wl : 0); if (!H) H = Hx || (wh ? sh / wh : 0);
  if (!L && H) L = H * aspect(p); if (!H && L) H = L / aspect(p);
  if (!L || !H) return {g, L: 0, H: 0, objs: [], dims: [], why: 'нужен хотя бы один размер'};
  const LH = [L, H], mm = q => { const u = q; return [u[0] * L, (1 - u[1]) * H]; };
  // 2. объекты и точки по фото
  const objs = [];
  for (const e of p.els) {
    if (e.t === 'obj') { const P = e.sp === 'img' ? [e.a, [e.b[0], e.a[1]], e.b, [e.a[0], e.b[1]]].map(q => mm(hap(g.f, q))) : [e.a, e.b];
      const xs = P.map(q => q[0]), ys = P.map(q => q[1]);
      objs.push({id: e.id, k: e.k, pt: 0, x0: clamp(Math.min(...xs), 0, L), x1: clamp(Math.max(...xs), 0, L), y0: clamp(Math.min(...ys), 0, H), y1: clamp(Math.max(...ys), 0, H), fx: {}, fy: {}}); }
    if (e.t === 'pt') { const q = e.sp === 'img' ? mm(hap(g.f, e.a)) : e.a; objs.push({id: e.id, k: e.k, pt: 1, n: e.n || 1, x0: q[0], x1: q[0], y0: q[1], y1: q[1], fx: {}, fy: {}}); }
  }
  // край объекта у края стены (≤3 %) — на краю: колонна во всю высоту, примыкание к углу
  for (const o of objs) if (!o.pt) { o.sn = []; if (o.x0 < 0.03 * L) { o.x0 = 0; o.sn.push('x0'); } if (o.x1 > 0.97 * L) { o.x1 = L; o.sn.push('x1'); } if (o.y0 < 0.03 * H) { o.y0 = 0; o.sn.push('y0'); } if (o.y1 > 0.97 * H) { o.y1 = H; o.sn.push('y1'); } }
  // 3. размеры → признаки (край стены / край объекта) и ограничения
  const tol = 0.07;
  const feats = ax => { const F = [{o: null, s: 0, v: 0}, {o: null, s: 1, v: ax === 'x' ? L : H}];
    for (const o of objs) { if (o.pt) F.push({o, s: 'c', v: ax === 'x' ? o.x0 : o.y0}); else { F.push({o, s: 0, v: ax === 'x' ? o.x0 : o.y0}); F.push({o, s: 1, v: ax === 'x' ? o.x1 : o.y1}); } } return F; };
  const near = (ax, val, excl) => { let b = null, bd = tol * (ax === 'x' ? L : H); for (const f of feats(ax)) { if (excl && f.o === excl.o && f.s === excl.s) continue; const d = Math.abs(f.v - val) * (f.o ? 1 : 0.5); if (d < bd) { bd = d; b = f; } } return b; };
  const dims = [];
  for (const e of p.els) if (e.t === 'dim') {
    const A = e.sp === 'img' ? mm(hap(g.f, e.a)) : e.a, B = e.sp === 'img' ? mm(hap(g.f, e.b)) : e.b;
    const ax = Math.abs(B[0] - A[0]) >= Math.abs(B[1] - A[1]) ? 'x' : 'y', i = ax === 'x' ? 0 : 1;
    const fa = near(ax, A[i]), fb = fa ? near(ax, B[i], fa) : null;
    dims.push({e, ax, A, B, fa, fb, est: Math.abs(B[i] - A[i])});
  }
  const keyOf = f => f.o ? f.o.id + ':' + f.s : 'W:' + f.s;
  const val = (ax, f) => f.o ? (f.s === 'c' ? (ax === 'x' ? f.o.x0 : f.o.y0) : (ax === 'x' ? (f.s ? f.o.x1 : f.o.x0) : (f.s ? f.o.y1 : f.o.y0))) : (f.s ? (ax === 'x' ? L : H) : 0);
  // pos[ax] — края с закреплённым положением; wlk — габарит задан размером
  const pos = {x: new Set(['W:0', 'W:1']), y: new Set(['W:0', 'W:1'])}, wlk = new Set();
  for (const o of objs) for (const k of o.sn || []) pos[k[0]].add(o.id + ':' + k[1]);   // край у края стены
  const K = ax => ax === 'x' ? ['x0', 'x1'] : ['y0', 'y1'];
  const setPos = (ax, f, v) => { const o = f.o, [k0, k1] = K(ax), P = pos[ax];
    if (o.pt) { o[k0] = o[k1] = v; P.add(keyOf(f)); return; }
    const me = f.s ? k1 : k0, oth = o.id + ':' + (f.s ? 0 : 1);
    if (wlk.has(o.id + ax) || !P.has(oth)) { const dv = v - o[me]; o[k0] += dv; o[k1] += dv; } else o[me] = v;
    P.add(keyOf(f)); if (wlk.has(o.id + ax)) P.add(oth); };
  const valid = dims.filter(d => d.e.v > 0 && d.fa && d.fb && (d.fa.o || d.fb.o));
  for (const d of valid) if (d.fa.o && d.fa.o === d.fb.o && !d.fa.o.pt) {   // габарит объекта: закреплённый край остаётся
    const o = d.fa.o, [k0, k1] = K(d.ax); if (pos[d.ax].has(o.id + ':1') && !pos[d.ax].has(o.id + ':0')) o[k0] = o[k1] - d.e.v; else o[k1] = o[k0] + d.e.v; wlk.add(o.id + d.ax); }
  const offs = valid.filter(d => !(d.fa.o && d.fa.o === d.fb.o)), done = new Set();
  for (let pass = 0; pass < 4; pass++) for (const d of offs) { if (done.has(d)) continue;
    const P = pos[d.ax], ka = keyOf(d.fa), kb = keyOf(d.fb); let base, mov;
    if (P.has(ka) && !P.has(kb)) { base = d.fa; mov = d.fb; } else if (P.has(kb) && !P.has(ka)) { base = d.fb; mov = d.fa; }
    else if (pass === 3 && !P.has(ka) && !P.has(kb)) { base = d.fa.o ? d.fa : d.fb; mov = base === d.fa ? d.fb : d.fa; } else continue;
    if (!mov.o) continue;
    const bv = val(d.ax, base), dir = Math.sign(val(d.ax, mov) - bv) || 1; setPos(d.ax, mov, bv + dir * d.e.v); done.add(d); }
  for (const d of dims) { if (!(d.e.v > 0)) { d.st = 'nov'; continue; } if (!d.fa || !d.fb) { d.st = 'free'; continue; }
    const got = Math.abs(val(d.ax, d.fb) - val(d.ax, d.fa)); d.res = got; d.st = Math.abs(got - d.e.v) <= 2 ? 'ok' : 'bad'; }
  return {g, L, H, objs, dims, ests};
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function aspect(p) { const g = geo(p); if (!g) return 1; const c = p.cor, d = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]); return (d(c[0], c[1]) + d(c[3], c[2])) / (d(c[0], c[3]) + d(c[1], c[2])); }

/* ═══ [BLOCK SK-LAYOUT] размещение: фото и стена под ним в мировых координатах ═══ */
const photoH = p => p.w * p.ih / p.iw;
function elev(p) {   // прямоугольник развёртки стены под фото (мир)
  const m = p._m; if (!m || !m.L) return null; const w = p.w, h = w * m.H / m.L; return {x: p.x, y: p.y + photoH(p) + 70, w, h, k: w / m.L};
}
const imgToW = (p, q) => [p.x + q[0] * p.w / p.iw, p.y + q[1] * p.w / p.iw];
const wToImg = (p, q) => [(q[0] - p.x) * p.iw / p.w, (q[1] - p.y) * p.iw / p.w];
const mmToW = (E, q) => [E.x + q[0] * E.k, E.y + E.h - q[1] * E.k];
const wToMm = (E, q) => [(q[0] - E.x) / E.k, (E.y + E.h - q[1]) / E.k];
const toScr = q => [(q[0] * S.view.s + S.view.ox) * DPR(), (q[1] * S.view.s + S.view.oy) * DPR()];
const toW = (sx, sy) => [(sx - S.view.ox) / S.view.s, (sy - S.view.oy) / S.view.s];

/* ═══ [BLOCK SK-DRAW] отрисовка ═══ */
function img(p) { if (!S.imgs[p.id]) { const im = new Image(); im.onload = () => { p.iw = im.naturalWidth; p.ih = im.naturalHeight; draw(); }; im.src = p.src; S.imgs[p.id] = im; } return S.imgs[p.id]; }
function rectified(p) {   // фото, выпрямленное по 4 углам (подложка варианта Б)
  const g = geo(p), m = p._m; if (!g || !m || !m.L) return null; if (p._rect && p._rk === m.L + 'x' + m.H) return p._rect;
  const im = img(p); if (!im.complete || !im.naturalWidth) return null;
  const W = 420, Hh = Math.round(W * m.H / m.L), src = document.createElement('canvas'); src.width = p.iw; src.height = p.ih; const sc = src.getContext('2d'); sc.drawImage(im, 0, 0);
  const sd = sc.getImageData(0, 0, p.iw, p.ih).data, out = document.createElement('canvas'); out.width = W; out.height = Hh; const oc = out.getContext('2d'), od = oc.createImageData(W, Hh);
  for (let y = 0; y < Hh; y++) for (let x = 0; x < W; x++) { const [ix, iy] = hap(g.r, [(x + .5) / W, (y + .5) / Hh]), X = ix | 0, Y = iy | 0; if (X < 0 || Y < 0 || X >= p.iw || Y >= p.ih) continue; const si = (Y * p.iw + X) * 4, di = (y * W + x) * 4; od.data[di] = sd[si]; od.data[di + 1] = sd[si + 1]; od.data[di + 2] = sd[si + 2]; od.data[di + 3] = 255; }
  oc.putImageData(od, 0, 0); p._rect = out; p._rk = m.L + 'x' + m.H; return out;
}
function draw() {
  const d = DPR(); cv.width = innerWidth * d; cv.height = innerHeight * d; cx.setTransform(1, 0, 0, 1, 0, 0); cx.fillStyle = '#E9ECF0'; cx.fillRect(0, 0, cv.width, cv.height);
  const s = S.view.s * d; cx.setTransform(s, 0, 0, s, S.view.ox * d, S.view.oy * d); const px = 1 / S.view.s;   // 1 px экрана
  for (const p of S.photos) {
    const im = img(p); if (!p.iw) continue; p._m = build(p);
    cx.drawImage(im, p.x, p.y, p.w, photoH(p));
    if (S.sel && S.sel.p === p.id && S.sel.photo) { cx.strokeStyle = '#1F6FD1'; cx.lineWidth = 3 * px; cx.strokeRect(p.x, p.y, p.w, photoH(p)); }
    // углы стены на фото
    if (p.cor) { const P = p.cor.map(q => imgToW(p, q)); cx.strokeStyle = '#F6B400'; cx.lineWidth = 2.5 * px; cx.setLineDash([8 * px, 5 * px]); cx.beginPath(); P.forEach((q, i) => i ? cx.lineTo(...q) : cx.moveTo(...q)); cx.closePath(); cx.stroke(); cx.setLineDash([]); P.forEach((q, i) => dot(q, '#F6B400', 7 * px, ['ЛВ', 'ПВ', 'ПН', 'ЛН'][i], px)); }
    else if (S.tool === 'cor' && S.pend && S.pend.p === p.id) S.pend.pts.forEach(q => dot(imgToW(p, q), '#F6B400', 7 * px, '', px));
    // элементы, нарисованные на фото (А)
