<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Measure — ядро холста (AKX-2026-0015)</title>
<link rel="stylesheet" href="core.css">
</head>
<body>
<!-- [BLOCK C-HTML] разметка ядра: шапка, холст, нижний ряд. Своих экранов/рамок нет. -->
<header id="cHd">
  <button id="cOk" title="Сохранить">✓</button>
  <input id="cName" placeholder="клиент · проект" autocomplete="off">
  <label id="cHl">H<input id="cH" inputmode="numeric" placeholder="мм" autocomplete="off"></label>
  <button id="cFit" title="Показать всё">⤢</button>
</header>
<canvas id="cCv"></canvas>
<div id="cCtx"></div>
<nav id="cTb">
  <div class="grp">
    <button data-t="sel" title="Выбор">↖</button>
    <button data-t="wall" title="Стена плана">／</button>
    <button data-t="dim" title="Размер / стрелка">↔</button>
    <button id="cPh" title="Фото">📷</button>
  </div>
  <div class="grp">
    <button id="cUn" title="Отменить">↶</button>
    <button id="cRe" title="Повторить">↷</button>
    <button id="cDel" title="Удалить">🗑</button>
  </div>
</nav>
<input id="cFile" type="file" accept="image/*" multiple hidden>
<input id="cCam" type="file" accept="image/*" capture="environment" hidden>
<div id="cUpd"><span></span><button></button></div>
<div id="cKb">
<button data-kk="1">1</button><button data-kk="2">2</button><button data-kk="3">3</button><button data-kk="bs">⌫</button>
<button data-kk="4">4</button><button data-kk="5">5</button><button data-kk="6">6</button><button data-kk="ok" class="ok">Готово</button>
<button data-kk="7">7</button><button data-kk="8">8</button><button data-kk="9">9</button>
<button data-kk=",">,</button><button data-kk="0">0</button><button data-kk="pm">±</button>
</div>
<div id="cToast"></div>
<script src="lab-version.js"></script>
<script src="core.js"></script>
</body>
</html>
